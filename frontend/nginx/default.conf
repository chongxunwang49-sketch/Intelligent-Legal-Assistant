server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 后端动态解析（Docker DNS）与负载均衡
    resolver 127.0.0.11 valid=10s;
    upstream zhifatong_backend {
        server backend:8000 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    # API 反向代理（保留 Host 端口防 FastAPI 307 丢端口）
    location ^~ /api/ {
        proxy_pass http://zhifatong_backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE：关闭缓冲，保持连接
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 300s;
    }

    # 文档/健康直通
    location = /health { proxy_pass http://zhifatong_backend; }
    location ~ ^/(docs|redoc|openapi.json)$ { proxy_pass http://zhifatong_backend; }

    # SPA
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|svg|png|jpg|jpeg|gif|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
